name: Live Empower authentication

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: empower-personal-capital-live-auth
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  live-auth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --all-groups --locked
      - name: Require live-test credentials
        env:
          EMPOWER_EMAIL: ${{ secrets.EMPOWER_EMAIL }}
          EMPOWER_PASSWORD: ${{ secrets.EMPOWER_PASSWORD }}
        run: |
          if [ -z "$EMPOWER_EMAIL" ] || [ -z "$EMPOWER_PASSWORD" ]; then
            echo "::error::Configure EMPOWER_EMAIL and EMPOWER_PASSWORD repository secrets"
            exit 1
          fi
      - name: Validate live login path
        env:
          EMPOWER_EMAIL: ${{ secrets.EMPOWER_EMAIL }}
          EMPOWER_PASSWORD: ${{ secrets.EMPOWER_PASSWORD }}
        run: uv run pytest -m live -vv
