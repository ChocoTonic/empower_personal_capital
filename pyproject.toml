[build-system]
requires = ["setuptools>=80.10.2"]
build-backend = "setuptools.build_meta"

[project]
name = "empower_personal_capital"
version = "0.0.2"
authors = [{ name = "chocotonic" }]
description = "A Python library for interacting with the Personal Capital API. Easily log in, handle two-factor authentication, and fetch financial data like account details and net worth. Simplify automation and data retrieval from your Personal Capital account with this lightweight and user-friendly package."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "certifi>=2026.10.19",
    "python-dotenv>=1.2.2,<2",
    "requests>=2.34.2,<3",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]

[project.urls]
Homepage = "https://github.com/ChocoTonic/empower_personal_capital"
Issues = "https://github.com/ChocoTonic/empower_personal_capital/issues"

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10",
    "pytest-cov>=7.1.0,<8",
    "ruff>=0.16.2,<0.17",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: opt-in tests that authenticate against a real Empower account",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
